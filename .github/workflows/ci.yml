name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Las dos versiones se bumpean a mano y son dos archivos distintos, así que se
      # desincronizan solas. Se nota recién al etiquetar, cuando el release falla y hay que
      # borrar la etiqueta: mejor que se note acá.
      - name: Check the manifest and the package agree on the version
        run: |
          manifest=$(node -p "require('./dist/manifest.json').version")
          pkg=$(node -p "require('./package.json').version")
          if [ "$manifest" != "$pkg" ]; then
            echo "::error::manifest.json is $manifest and package.json is $pkg — bump both"
            exit 1
          fi
          echo "version $manifest"

      # El zip de cada commit sirve para probar un cambio sin compilar nada localmente:
      # se baja, se descomprime y se carga en chrome://extensions.
      - name: Package the unpacked extension
        run: cd dist && zip -r ../meet-music.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: meet-music-unpacked
          path: meet-music.zip
          if-no-files-found: error
          retention-days: 30
